# Releases the `relaton-api` gem. Version numbers are a product decision,
# made at dispatch time through this workflow — the shared release job runs
# `gem bump --version <next>` on the single source of truth
# (lib/relaton/api/version.rb, which the gemspec reads at build time), so a
# release is one GHA trigger and the version file is never hand-edited.
name: release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version: x.y.z / major / minor / patch / pre|rc|etc,
          or 'skip' to push the current version without a version bump or tag.
        required: true
        default: 'skip'
  repository_dispatch:
    types: [ do-release ]

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  release:
    uses: relaton/support/.github/workflows/release.yml@main
    with:
      next_version: ${{ github.event.inputs.next_version || 'skip' }}
    secrets:
      rubygems-api-key: ${{ secrets.RELATON_CI_RUBYGEMS_API_KEY }}
