# The reference Rack implementation is held to the same executable contract
# as the Workers stack: `rspec` covers the app's own behavior, and the
# contract job replays relaton-api-js's fixture set against production — the
# same run.mjs that repo's CI executes, so both implementations answer the
# one fixture set (TODO.api/12). The smoke is read-only GETs.
name: rake

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rspec spec

  contract:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Run the shared contract fixtures against production
        # Consumes the RELEASED @relaton/api npm package (contract v2.0.1,
        # 13 fixtures). Upgrading the pinned version is a deliberate PR,
        # driven by an @relaton/api release (that repo's contract/README.md
        # records the protocol; raw commit URLs are never a channel).
        run: |
          mkdir contract
          npm pack @relaton/api@3.0.0 --silent --pack-destination contract
          tar -xzf contract/relaton-api-3.0.0.tgz --strip-components=2 \
            package/contract/run.mjs package/contract/fixtures.json -C contract
          RELATON_API_BASE_URL=https://api.relaton.org node contract/run.mjs
